name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.3.0)
        required: true
        default: '1.3.0'
        type: string
      build_number:
        description: Increasing Android build number (never reuse a published number)
        required: true
        default: '4'
        type: string

permissions:
  contents: read

concurrency:
  group: android-official-release
  cancel-in-progress: false

jobs:
  android:
    if: github.ref_type == 'branch' && github.ref_name == vars.MOBILE_RELEASE_BRANCH
    runs-on: windows-latest
    timeout-minutes: 60
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Validate release settings
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          SIGNING_FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or
              $env:RELEASE_BUILD -notmatch '^[1-9]\d{0,9}$' -or
              [long]$env:RELEASE_BUILD -gt 2100000000) { throw 'Invalid release version.' }
          if ($env:API_BASE_URL -ne 'https://algofran-center.tech/api/v1') { throw 'Configure the approved production API URL.' }
          if ($env:SIGNING_FINGERPRINT -notmatch '^[a-fA-F0-9]{64}$') { throw 'Pin the existing production signing certificate fingerprint.' }
      - name: Analyze and test before loading signing secrets
        shell: pwsh
        working-directory: mobile
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore the permanent signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          if (!$env:KEYSTORE_BASE64 -or !$env:KEY_PROPERTIES_BASE64) { throw 'Configure both signing secrets in the mobile-release environment.' }
          New-Item -ItemType Directory -Path mobile/android/keystore -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $pwd 'mobile/android/keystore/gofran-release.jks'), [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          [IO.File]::WriteAllBytes((Join-Path $pwd 'mobile/android/key.properties'), [Convert]::FromBase64String($env:KEY_PROPERTIES_BASE64))
      - name: Build and verify the signed APK
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUILD: ${{ inputs.build_number }}
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL }}
          SIGNING_FINGERPRINT: ${{ vars.ANDROID_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          ./mobile/scripts/build_release_apk.ps1 -ApiBaseUrl $env:API_BASE_URL -BuildName $env:RELEASE_VERSION -BuildNumber ([int]$env:RELEASE_BUILD) -ExpectedSigningSha256 $env:SIGNING_FINGERPRINT
      - name: Save only the verified release files
        uses: actions/upload-artifact@v4
        with:
          name: gofran-android-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            mobile/build/releases/*.apk
            mobile/build/releases/*.apk.sha256
            mobile/build/releases/*.apk.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material from the temporary runner
        if: always()
        shell: pwsh
        run: |
          # Explicit files only; do not remove a computed directory recursively.
          foreach ($file in @('mobile/android/key.properties', 'mobile/android/keystore/gofran-release.jks')) {
            if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
          }
